[build]
  # 1. Create the env.txt file
  # 2. Delete any cached flutter folder (rm -rf flutter)
  # 3. Clone fresh Flutter SDK
  # 4. Build the web app
  command = "echo \"$ENV_CONTENT\" > env.txt && rm -rf flutter && git clone https://github.com/flutter/flutter.git -b stable --depth 1 && ./flutter/bin/flutter build web --release"
  
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200